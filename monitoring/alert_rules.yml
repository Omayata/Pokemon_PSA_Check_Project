# เกณฑ์การแจ้งเตือน (ค่าตรงกับ slo: และ monitoring: ใน configs/params.yaml)
groups:
  - name: psa-system-health
    rules:
      - alert: ApiDown
        expr: up{job="psa-api"} == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "API ไม่ตอบ /metrics เกิน 1 นาที"}

      - alert: ModelNotLoaded
        expr: psa_model_loaded == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "API ทำงานแต่ไม่มีโมเดล"}

      - alert: HighP95Latency
        expr: histogram_quantile(0.95, sum(rate(psa_request_latency_seconds_bucket{endpoint="/predict"}[5m])) by (le)) > 0.5
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "p95 latency เกิน SLO 500 ms"}

      - alert: HighErrorRate
        expr: >
          sum(rate(psa_requests_total{endpoint="/predict",status=~"5.."}[5m]))
          / clamp_min(sum(rate(psa_requests_total{endpoint="/predict"}[5m])), 1e-9) > 0.01
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "error rate (5xx) เกิน SLO 1%"}

  - name: psa-prediction-quality
    rules:
      - alert: HighInputRejectionRate
        expr: >
          sum(rate(psa_rejected_inputs_total[15m]))
          / clamp_min(sum(rate(psa_requests_total{endpoint="/predict"}[15m])), 1e-9) > 0.2
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "ภาพขาเข้าถูกปฏิเสธเกิน 20% (ข้อมูลต้นทางอาจเปลี่ยน)"}

      - alert: DataDrift
        expr: psa_data_drift_detected == 1
        labels: {severity: warning}
        annotations: {summary: "Data drift: PSI > 0.2 และ KS p < 0.01 -> ตามนโยบายจะ retrain"}

      - alert: ConceptDrift
        expr: psa_concept_drift_detected == 1
        labels: {severity: critical}
        annotations: {summary: "Concept drift: ความตรงกับเกรด PSA จริงลดลงเกิน 15%"}
